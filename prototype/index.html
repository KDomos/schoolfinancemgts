<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>SFMS · School Fees Manager</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&family=Source+Serif+4:wght@600;700&display=swap">
<style>
:root{--bg:#F2F4F7;--card:#fff;--ink:#1B2740;--mut:#5C6880;--line:#D9DFE8;--acc:#8E2A3A;--ok:#2F7D5B;--warn:#B9791A;--r:6px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10151F;--card:#19202E;--ink:#E6EAF2;--mut:#98A3B8;--line:#2C3548;--acc:#E0707F;--ok:#5CC49A;--warn:#E3A94B}}
:root[data-theme=dark]{--bg:#10151F;--card:#19202E;--ink:#E6EAF2;--mut:#98A3B8;--line:#2C3548;--acc:#E0707F;--ok:#5CC49A;--warn:#E3A94B}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Public Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Source Serif 4",Georgia,serif;margin:0}
header{background:var(--ink);color:#fff;padding:14px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:20px;flex:1;min-width:160px}header small{opacity:.7;display:block;font:400 12px "Public Sans"}
header select{background:#ffffff1f;color:#fff;border:1px solid #ffffff55;border-radius:var(--r);padding:6px}
header option{color:#000}
nav{display:flex;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav button{flex:none;border:0;background:none;color:var(--mut);padding:12px 16px;font:600 14px "Public Sans";cursor:pointer;border-bottom:3px solid transparent}
nav button.on{color:var(--acc);border-color:var(--acc)}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.big{font:700 26px "Source Serif 4",serif}.mut{color:var(--mut);font-size:13px}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--ok)}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:8px}
input,select{width:100%;padding:9px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--ink);font:inherit}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}
.btn{background:var(--acc);color:#fff;border:0;border-radius:var(--r);padding:10px 14px;font:600 14px "Public Sans";cursor:pointer}
.btn.alt{background:none;color:var(--acc);border:1px solid var(--acc)}.btn.sm{padding:5px 9px;font-size:12px}
:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{color:var(--mut);font-weight:600}
td.n,th.n{text-align:right}.ok{color:var(--ok)}.bad{color:var(--acc)}
.tag{padding:2px 8px;border-radius:10px;font-size:12px;background:var(--line)}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
#modal.on{display:flex}#sheet{background:#fff;color:#111;max-width:480px;width:100%;max-height:90vh;overflow:auto;padding:22px;border-radius:var(--r)}
#sheet table td,#sheet table th{border-color:#ddd;color:#111}
pre{background:var(--bg);padding:10px;border-radius:var(--r);overflow-x:auto;font-size:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--r);display:none;z-index:30}
@media print{body *{visibility:hidden}#sheet,#sheet *{visibility:visible}#modal{position:absolute;background:none;display:block}#sheet{max-height:none}.noprint{display:none!important}}
:root{--r:12px}header{background:linear-gradient(120deg,#1B2740,#3A2150 70%,#8E2A3A)}nav{background:var(--bg);border:0;padding:8px 10px;gap:4px}nav button{border-radius:999px;border:0;padding:8px 14px}nav button.on{background:var(--ink);color:var(--bg)}.card{border:0;box-shadow:0 1px 2px #1b27400d,0 10px 24px -14px #1b274040}.btn{border-radius:999px}th{font-size:12px}#roleSel{display:none}#lgn{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;align-items:center;justify-content:center}#lgn h2{font-size:28px;color:var(--acc)}#gs{width:min(340px,100%);border:1px solid #ffffff55;background:#ffffff1f;color:inherit;border-radius:999px;padding:9px 14px}#gs::placeholder{color:inherit;opacity:.65}
.kpi{display:flex;gap:12px;align-items:center}.ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none}.kpi .big{font-size:22px;line-height:1.2}
.g3,.g2,.g3b{display:grid;gap:16px;margin-bottom:16px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}.g3 .card,.g2 .card,.g3b .card,.grid .card{margin:0}.grid{margin-bottom:16px}
.ch{display:flex;justify-content:space-between;align-items:center}.ch a{font-size:13px;color:var(--acc);text-decoration:none}.pr{margin:12px 0}.prh{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px}.dn{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.lg{display:flex;align-items:center;gap:6px;font-size:13px;margin:6px 0}.lg b{margin-left:auto;padding-left:14px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:2px}.wk div{padding:6px 0;border-radius:10px}.wk small{display:block;color:var(--mut);font-size:11px}.wk b{display:block}.wk i{display:block;width:5px;height:5px;border-radius:50%;background:var(--ok);margin:3px auto 0}.wk .td{background:#2F6BFF;color:#fff}.wk .td small{color:#dfe8ff}
.al{display:flex;gap:10px;margin:8px 0;font-size:13px}.al i{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none}
.kb{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.kc{background:color-mix(in srgb,var(--c) 10%,transparent);border-radius:12px;padding:12px}.kc h4{margin:0 0 10px;font-size:14px;color:var(--c)}.kc h4 span{background:#ffffff99;color:#333;padding:1px 8px;border-radius:8px;margin-left:6px}.kt{background:var(--card);border-radius:10px;padding:10px;margin-bottom:8px;box-shadow:0 1px 2px #0001}.pill{display:inline-block;margin-top:6px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600}
@media(min-width:900px){.g2{grid-template-columns:2fr 1fr}.g3b{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}
header{margin-left:220px;background:var(--card);color:var(--ink);border-bottom:1px solid var(--line);padding:12px 28px}header select{background:var(--bg);color:var(--ink);border-color:var(--line)}header option{color:var(--ink)}#gs{border-color:var(--line);background:var(--bg)}
nav{position:fixed;left:0;top:0;bottom:0;width:220px;flex-direction:column;overflow-y:auto;padding:76px 12px 16px;background:var(--card);border-right:1px solid var(--line);gap:2px;z-index:6}nav::before{content:"SFMS";position:fixed;top:0;left:0;width:220px;padding:16px 22px;font:700 24px "Source Serif 4",serif;color:var(--acc);background:var(--card)}
nav button{text-align:left;border-radius:10px;width:100%}nav button.on{background:#4a6fe52e;color:var(--ink)}main{margin-left:220px;max-width:1240px;padding:22px 28px}}
</style></head><body>
<header><div style="flex:1;min-width:170px"><h1 id="sn">School Fees Manager</h1><small>Bursar workspace</small></div>
<select id="termSel" aria-label="Term"></select></header>
<nav id="nav"></nav><main id="main"></main>
<div id="modal"><div id="sheet"></div></div><div class="toast" id="toast"></div>
<script>
var S={school:"Your School Name",year:2026,term:1,students:[],fees:[],pays:[],exps:[],unmatched:[],n:1,x:1};
var tab="dash",TABS={dash:"Dashboard",stu:"Students",fee:"Fees",pay:"Payments",led:"Ledger",rep:"Reports"};
try{var raw=localStorage.getItem("sfms");if(raw)S=JSON.parse(raw)}catch(e){}
function save(){try{localStorage.setItem("sfms",JSON.stringify(S))}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function m(n){return "UGX "+Math.round(n).toLocaleString("en-UG")}
function today(){return new Date().toISOString().slice(0,10)}
function toast(t){var e=$("toast");e.textContent=t;e.style.display="block";setTimeout(function(){e.style.display="none"},2600)}
function items(s,t){return S.fees.filter(function(f){return(f.cls==="All"||f.cls===s.cls)&&(f.term==="All"||+f.term===t)&&(!f.boarding||s.type==="Boarding")})}
function inv(s,t){return items(s,t).reduce(function(a,f){return a+f.amt},0)}
function paid(s,t){return S.pays.filter(function(p){return p.code===s.code&&p.term===t}).reduce(function(a,p){return a+p.amt},0)}
function bal(s,t){return inv(s,t)-paid(s,t)}
function byCode(c){return S.students.filter(function(s){return s.code===String(c).trim().toUpperCase()})[0]}
function classes(){var o=[];S.students.forEach(function(s){if(o.indexOf(s.cls)<0)o.push(s.cls)});return o}
function addStudent(name,cls,type){var code="SF"+String(S.year).slice(2)+String(S.n++).padStart(4,"0");S.students.push({id:S.x++,name:name,cls:cls,type:type,code:code})}
function addPay(code,amt,method,ref,date){var s=byCode(code);S.pays.push({id:S.x++,date:date||today(),code:s.code,amt:amt,method:method,ref:ref||"",term:S.term});return S.pays[S.pays.length-1]}
/* Webhook handler: what a MTN/Airtel/SchoolPay callback would call on the server */
function ingest(p){
 var dup=S.pays.concat(S.unmatched).some(function(x){return x.ref&&x.ref===p.txn_id});
 if(dup)return"Duplicate transaction ignored";
 var s=byCode(p.student_code);
 if(!s){S.unmatched.push({id:S.x++,date:today(),code:p.student_code,amt:+p.amount,method:p.provider,ref:p.txn_id});save();return"No student with that code — held in Unmatched"}
 var pay=addPay(s.code,+p.amount,p.provider,p.txn_id);save();return pay}
function expected(t){return S.students.reduce(function(a,s){return a+inv(s,t)},0)}
function collected(t){return S.pays.filter(function(p){return p.term===t}).reduce(function(a,p){return a+p.amt},0)}
function spent(){return S.exps.reduce(function(a,e){return a+e.amt},0)}
function cash(){return S.pays.reduce(function(a,p){return a+p.amt},0)-spent()}
function show(h){$("sheet").innerHTML=h+'<div class="noprint" style="margin-top:14px;display:flex;gap:8px"><button class="btn" onclick="window.print()">Print</button><button class="btn alt" onclick="$(\'modal\').classList.remove(\'on\')">Close</button></div>';$("modal").classList.add("on")}
function invoice(id){var s=S.students.filter(function(x){return x.id===id})[0],t=S.term,it=items(s,t);
 show('<h2>'+esc(S.school)+'</h2><div class="mut" style="color:#555">Fee statement · Term '+t+', '+S.year+'</div><p><b>'+esc(s.name)+'</b><br>'+esc(s.cls)+' · '+s.type+'<br>Payment code: <b style="font-size:20px">'+s.code+'</b></p><table>'+
 it.map(function(f){return'<tr><td>'+esc(f.name)+'</td><td class="n">'+m(f.amt)+'</td></tr>'}).join("")+
 '<tr><th>Total billed</th><th class="n">'+m(inv(s,t))+'</th></tr><tr><td>Paid</td><td class="n">'+m(paid(s,t))+'</td></tr><tr><th>Balance due</th><th class="n">'+m(bal(s,t))+'</th></tr></table><p style="color:#555;font-size:13px">Pay by mobile money using the code above as the reference.</p>')}
function receipt(id){var p=S.pays.filter(function(x){return x.id===id})[0],s=byCode(p.code),b=bal(s,p.term);
 var sms="Received "+m(p.amt)+" for "+s.name+" ("+s.code+"), Term "+p.term+". Balance: "+m(b)+". "+S.school;
 show('<h2>'+esc(S.school)+'</h2><div style="color:#555">Receipt R-'+String(p.id).padStart(5,"0")+' · '+p.date+'</div><p><b>'+esc(s.name)+'</b> · '+esc(s.cls)+'<br>Code '+s.code+' · Term '+p.term+'</p><table><tr><td>Amount received</td><th class="n">'+m(p.amt)+'</th></tr><tr><td>Method</td><td class="n">'+esc(p.method)+'</td></tr><tr><td>Reference</td><td class="n">'+esc(p.ref||"—")+'</td></tr><tr><td>Balance after payment</td><th class="n">'+m(b)+'</th></tr></table><p class="noprint" style="font-size:13px;color:#555"><b>SMS text:</b><br>'+esc(sms)+'</p>')}
function V(){
 var t=S.term,h="",e=expected(t),c=collected(t);
 if(tab==="dash"){var pct=e?Math.min(100,c/e*100):0,df=S.students.filter(function(s){return bal(s,t)>0}).sort(function(a,b){return bal(b,t)-bal(a,t)}).slice(0,5);
 h='<div class="grid"><div class="card"><div class="mut">Expected, term '+t+'</div><div class="big">'+m(e)+'</div></div><div class="card"><div class="mut">Collected</div><div class="big ok">'+m(c)+'</div><div class="bar"><i style="width:'+pct+'%"></i></div><div class="mut">'+pct.toFixed(0)+'% of expected</div></div><div class="card"><div class="mut">Cash balance (all terms)</div><div class="big">'+m(cash())+'</div></div></div>'+
 '<div class="card"><h3>Largest balances</h3>'+(df.length?'<div class="tw"><table>'+df.map(function(s){return'<tr><td>'+esc(s.name)+'</td><td>'+esc(s.cls)+'</td><td class="n bad">'+m(bal(s,t))+'</td></tr>'}).join("")+'</table></div>':'<p class="mut">No arrears. Add students and fees to start billing, or load sample data.</p>')+'</div>'+
 (S.students.length?'':'<button class="btn" onclick="demo()">Load sample data</button> ')+'<button class="btn alt" onclick="wipe()">Reset all data</button>'+
 '<div class="card" style="margin-top:16px"><label>School name on invoices and receipts<input id="sch" value="'+esc(S.school)+'" onchange="S.school=this.value;save();hdr()"></label></div>'}
 if(tab==="stu"){h='<div class="card"><h3>Register student</h3><div class="row"><label>Full name<input id="sn1"></label><label>Class / stream<input id="sc" placeholder="e.g. P.6 Blue"></label><label>Type<select id="st"><option>Day</option><option>Boarding</option></select></label><button class="btn" onclick="addS()">Add student</button></div></div><div class="card tw"><table><tr><th>Name</th><th>Class</th><th>Type</th><th>Code</th><th class="n">Term '+t+' bill</th><th></th></tr>'+
 S.students.map(function(s){return'<tr><td>'+esc(s.name)+'</td><td>'+esc(s.cls)+'</td><td><span class="tag">'+s.type+'</span></td><td>'+s.code+'</td><td class="n">'+m(inv(s,t))+'</td><td><button class="btn sm alt" onclick="invoice('+s.id+')">Invoice</button></td></tr>'}).join("")+'</table>'+(S.students.length?'':'<p class="mut">No students yet.</p>')+'</div>'}
 if(tab==="fee"){h='<div class="card"><h3>Add fee item</h3><p class="mut">One fee applies to a whole class, or to everyone. Boarding-only items are billed to boarders only.</p><div class="row"><label>Name<input id="fn" placeholder="Tuition"></label><label>Amount (UGX)<input id="fa" type="number" min="0"></label><label>Class<select id="fc"><option>All</option>'+classes().map(function(c){return'<option>'+esc(c)+'</option>'}).join("")+'</select></label><label>Term<select id="ft"><option>All</option><option>1</option><option>2</option><option>3</option></select></label><label>Boarders only<select id="fb"><option value="">No</option><option value="1">Yes</option></select></label><button class="btn" onclick="addF()">Add fee</button></div></div><div class="card tw"><table><tr><th>Item</th><th>Class</th><th>Term</th><th>Applies to</th><th class="n">Amount</th><th></th></tr>'+
 S.fees.map(function(f,i){return'<tr><td>'+esc(f.name)+'</td><td>'+esc(f.cls)+'</td><td>'+f.term+'</td><td>'+(f.boarding?"Boarders":"All students")+'</td><td class="n">'+m(f.amt)+'</td><td><button class="btn sm alt" onclick="S.fees.splice('+i+',1);save();V()">Remove</button></td></tr>'}).join("")+'</table></div>'}
 if(tab==="pay"){h='<div class="card"><h3>Record payment · term '+t+'</h3><div class="row"><label>Student code<input id="pc" placeholder="SF260001"></label><label>Amount (UGX)<input id="pa" type="number" min="1"></label><label>Method<select id="pm"><option>Cash</option><option>Bank slip</option><option>Cheque</option></select></label><label>Slip / cheque no.<input id="pr"></label><button class="btn" onclick="manPay()">Save and show receipt</button></div></div>'+
 '<div class="card"><h3>Mobile money callback (simulator)</h3><p class="mut">A parent pays with the student code as reference. Your gateway posts this payload to the school server, which calls the same handler used here.</p><div class="row"><label>Provider<select id="mp"><option>MTN MoMo</option><option>Airtel Money</option><option>SchoolPay</option></select></label><label>Student code<input id="mc"></label><label>Amount<input id="ma" type="number" min="1"></label><button class="btn alt" onclick="sim()">Send test payment</button></div><pre id="payload">Waiting for a payment…</pre></div>'+
 (S.unmatched.length?'<div class="card"><h3>Unmatched payments</h3><div class="tw"><table>'+S.unmatched.map(function(u,i){return'<tr><td>'+u.date+'</td><td>'+esc(u.code)+'</td><td>'+esc(u.method)+'</td><td class="n">'+m(u.amt)+'</td><td><button class="btn sm alt" onclick="fix('+i+')">Assign to a code</button></td></tr>'}).join("")+'</table></div></div>':'')+
 '<div class="card tw"><h3>Recent payments</h3><table><tr><th>Date</th><th>Student</th><th>Method</th><th class="n">Amount</th><th></th></tr>'+S.pays.slice().reverse().slice(0,25).map(function(p){var s=byCode(p.code);return'<tr><td>'+p.date+'</td><td>'+esc(s.name)+'</td><td>'+esc(p.method)+'</td><td class="n">'+m(p.amt)+'</td><td><button class="btn sm alt" onclick="receipt('+p.id+')">Receipt</button></td></tr>'}).join("")+'</table></div>'}
 if(tab==="led"){var rows=S.pays.map(function(p){return{d:p.date,k:"in",c:"Fees · "+byCode(p.code).name,a:p.amt,w:p.method}}).concat(S.exps.map(function(x){return{d:x.date,k:"out",c:x.cat+" · "+x.note,a:x.amt,w:x.acct}})).sort(function(a,b){return a.d<b.d?-1:1}),run=0;
 h='<div class="card"><h3>Record expense</h3><div class="row"><label>Category<select id="ec"><option>Catering</option><option>Transport</option><option>Utilities</option><option>Stationery</option><option>Maintenance</option><option>Administration</option></select></label><label>Description<input id="en"></label><label>Amount (UGX)<input id="ea" type="number" min="1"></label><label>Paid from<select id="eac"><option>Cash</option><option>Bank</option><option>Mobile money</option></select></label><button class="btn" onclick="addE()">Save expense</button></div></div><div class="grid"><div class="card"><div class="mut">Income</div><div class="big ok">'+m(S.pays.reduce(function(a,p){return a+p.amt},0))+'</div></div><div class="card"><div class="mut">Expenses</div><div class="big bad">'+m(spent())+'</div></div></div><div class="card tw"><table><tr><th>Date</th><th>Entry</th><th class="n">In</th><th class="n">Out</th><th class="n">Balance</th></tr>'+
 rows.map(function(r){run+=r.k==="in"?r.a:-r.a;return'<tr><td>'+r.d+'</td><td>'+esc(r.c)+'</td><td class="n ok">'+(r.k==="in"?m(r.a):"")+'</td><td class="n bad">'+(r.k==="out"?m(r.a):"")+'</td><td class="n">'+m(run)+'</td></tr>'}).join("")+'</table></div>'}
 if(tab==="rep"){var dl=S.students.filter(function(s){return bal(s,t)>0}).sort(function(a,b){return bal(b,t)-bal(a,t)});
 h='<div class="card tw"><h3>Defaulters · term '+t+'</h3><table><tr><th>Student</th><th>Class</th><th>Code</th><th class="n">Billed</th><th class="n">Paid</th><th class="n">Arrears</th></tr>'+dl.map(function(s){return'<tr><td>'+esc(s.name)+'</td><td>'+esc(s.cls)+'</td><td>'+s.code+'</td><td class="n">'+m(inv(s,t))+'</td><td class="n">'+m(paid(s,t))+'</td><td class="n bad">'+m(bal(s,t))+'</td></tr>'}).join("")+'</table>'+(dl.length?'':'<p class="mut">No arrears this term.</p>')+'<button class="btn alt" onclick="csv()">Download CSV</button></div>'+
